<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t"><title id="t">224 minutes at $20 per hour: exact minutes yield $74.67; prematurely rounded hours yield $74.60</title><rect width="1000" height="440" fill="#edf2f6"/><g font-family="Arial,sans-serif" fill="#233548"><text x="36" y="52" font-size="28" font-weight="700">Keep minutes until the money step.</text><text x="36" y="100" font-size="23">Illustrated rate: $20/hour · 1h59m + 1h45m</text><path d="M36 125H964" stroke="#b7c7d3"/><text x="36" y="178" font-size="25">Exact: (119 + 105) ÷ 60 × $20</text><text x="36" y="222" font-size="32" font-weight="700">224 minutes → $74.67</text><text x="36" y="285" font-size="25">Premature rounding: (1.98 + 1.75) × $20</text><text x="36" y="329" font-size="32" font-weight="700">3.73 hours → $74.60 · difference $0.07</text><text x="36" y="393" font-size="21">Synthetic example · straight-time subtotal · final cent rounding</text></g></svg>