<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Homebase: the sixth-person price threshold</title><desc id="d">Qualifying example: six free payroll months. Five paid employees afterward cost 59 monthly, subtotal354. A sixth paid employee in month9 changes the final four months to85, subtotal458, difference104.</desc><rect width="1000" height="500" rx="18" fill="#edf3f9"/><g font-family="Arial, sans-serif" fill="#172f4a"><text x="40" y="52" font-size="28" font-weight="700">Homebase: a sixth paid employee changes the base too</text><text x="40" y="86" font-size="19">Example, not your quote · Offer and rates checked October 30, 2026</text><rect x="36" y="111" width="928" height="62" rx="8" fill="white"/><text x="56" y="151" font-size="24">Months 1–6: qualifying payroll offer = $0</text><rect x="36" y="193" width="451" height="159" rx="8" fill="white"/><rect x="507" y="193" width="457" height="159" rx="8" fill="white"/><text x="56" y="228" font-size="22" font-weight="700">Five paid employees throughout</text><text x="56" y="269" font-size="23">Months 7–12: 6 × $59</text><text x="56" y="316" font-size="32" font-weight="700">$354 payroll subtotal</text><text x="527" y="228" font-size="22" font-weight="700">Six paid employees from month 9</text><text x="527" y="269" font-size="23">2 × $59 + 4 × $85 = $118 + $340</text><text x="527" y="316" font-size="32" font-weight="700">$458 payroll subtotal</text><rect x="36" y="373" width="928" height="67" rx="8" fill="#172f4a"/><text x="56" y="416" fill="white" font-size="26" font-weight="700">Difference $104 = 4 × ($20 base change + $6 person fee)</text><text x="40" y="476" font-size="18">Excludes selected management plans, tax, extras and wage funding. Eligibility required.</text></g></svg>
