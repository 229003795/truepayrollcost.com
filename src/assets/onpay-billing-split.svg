<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">OnPay: reconcile the annual subtotal</title><desc id="d">79 times 12 equals 948. Two extra included workers for two months add 24. Five mailed forms add 50. Known-charge example subtotal 1022.</desc><rect width="1000" height="480" rx="20" fill="#edf3f9"/><g font-family="Arial, sans-serif" fill="#172f4a"><text x="44" y="56" font-size="28" font-weight="700">OnPay: annual billing reconciliation</text><text x="44" y="91" font-size="19">Example, not your quote · Rates checked October 29, 2026</text><rect x="36" y="120" width="928" height="76" rx="8" fill="white"/><text x="56" y="151" font-size="19">Five billable workers · Payroll Essentials</text><text x="56" y="181" font-size="25" font-weight="700">($49 + $6 × 5) × 12 = $79 × 12 = $948</text><text x="56" y="238" font-size="22">+ Two extra zero-pay workers included for two months</text><text x="56" y="272" font-size="25" font-weight="700">$6 × 2 × 2 = $24</text><text x="56" y="318" font-size="22">+ Five optional mailed forms: $10 × 5 = $50</text><rect x="36" y="346" width="928" height="64" rx="8" fill="#172f4a"/><text x="56" y="387" font-size="28" fill="white" font-weight="700">Known-charge subtotal: $948 + $24 + $50 = $1,022</text><text x="44" y="447" font-size="19">Tax and unresolved extras remain pending. Extra workers/forms are assumptions.</text></g></svg>
