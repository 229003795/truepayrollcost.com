<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Rippling quote worksheet: rate versus quantity</title><desc id="d">Hypothetical headcount falls from ten to five after six months. Actual billing90 user-months versus a hypothetical ten-seat floor120, difference30. At the8-dollar published starting reference, annual reference subtotals1200 and1440 differ240. Not a payroll quote or asserted contract rule.</desc><rect width="1000" height="500" rx="18" fill="#edf3f9"/><g font-family="Arial, sans-serif" fill="#172f4a"><text x="40" y="52" font-size="28" font-weight="700">A matching rate can conceal a different billed quantity</text><text x="40" y="88" font-size="19">Hypothetical worksheet · Sources checked October 31, 2026</text><rect x="36" y="112" width="450" height="211" rx="8" fill="white"/><rect x="506" y="112" width="458" height="211" rx="8" fill="white"/><text x="56" y="151" font-size="23" font-weight="700">Actual-user scenario</text><text x="56" y="193" font-size="24">10 × 6 + 5 × 6 = 90 user-months</text><text x="56" y="238" font-size="22">$40 × 12 + $8 × 90</text><text x="56" y="288" font-size="32" font-weight="700">$1,200 reference subtotal</text><text x="526" y="151" font-size="23" font-weight="700">Hypothetical ten-seat floor</text><text x="526" y="193" font-size="24">10 × 12 = 120 user-months</text><text x="526" y="238" font-size="22">$40 × 12 + $8 × 120</text><text x="526" y="288" font-size="32" font-weight="700">$1,440 reference subtotal</text><rect x="36" y="346" width="928" height="65" rx="8" fill="#172f4a"/><text x="56" y="389" font-size="27" font-weight="700" fill="white">30 extra user-months × $8 = $240 difference</text><text x="40" y="449" font-size="19">Not a payroll quote. Payroll products, setup and contract terms remain pending.</text><text x="40" y="478" font-size="19">The ten-seat floor is an assumption, not an asserted Rippling policy.</text></g></svg>
