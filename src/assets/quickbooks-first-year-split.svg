<text x="48" y="94" font-size="20">Workforce Payroll + Simple Start · five billable employees</text>
<rect x="48" y="126" width="904" height="58" rx="6" fill="#e4edf4"/>
<text x="72" y="163" font-size="23">The employee fee stays the same in both periods</text>
