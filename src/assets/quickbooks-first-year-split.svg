<title id="title">First-year bundle subtotal: $1,314</title><desc id="desc">The first three promotional months total $229.50 at $76.50 per month. The following nine regular-price months total $1,084.50 at $120.50 per month. Combined subscription subtotal: $1,314.</desc>
<rect width="1000" height="760" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#233548">
