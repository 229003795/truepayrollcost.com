<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t"><title id="t">Example shift: elapsed time minus unpaid time gives paid hours</title><rect width="1000" height="540" fill="#f5f7fa"/><g fill="#233548" font-family="Arial,sans-serif"><text x="42" y="58" font-size="30" font-weight="700">Clock time → paid minutes → decimal hours</text><text x="42" y="100" font-size="21">Illustrative shift · 08:30–17:00</text><rect x="42" y="134" width="916" height="102" rx="8" fill="white" stroke="#b3c1ce"/><text x="64" y="176" font-size="24">Elapsed time</text><text x="64" y="214" font-size="28" font-weight="700">8 hours 30 minutes = 510 minutes</text><path d="M500 236v35" stroke="#245d82" stroke-width="3"/><rect x="42" y="271" width="916" height="92" rx="8" fill="white" stroke="#b3c1ce"/><text x="64" y="310" font-size="24">Subtract only confirmed unpaid time</text><text x="64" y="346" font-size="28" font-weight="700">510 − 30 = 480 paid minutes</text><rect x="42" y="390" width="916" height="90" rx="8" fill="#233548"/><text x="64" y="428" font-size="23" fill="white">Convert after subtracting the unpaid period</text><text x="64" y="465" font-size="30" font-weight="700" fill="white">480 ÷ 60 = 8.00 payroll hours</text><text x="42" y="515" font-size="18">Example inputs, not an employee record · Checked October 25, 2026</text></g></svg>