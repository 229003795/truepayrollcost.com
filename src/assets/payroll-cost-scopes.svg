<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t"><title id="t">A service subscription is one layer of payroll cost</title><rect width="1000" height="520" rx="16" fill="#edf3f9"/><g font-family="Arial,sans-serif" fill="#23364b"><text x="40" y="55" font-size="27">Five-person illustration · not your quote</text><rect x="30" y="85" width="940" height="160" rx="10" fill="#172f4a"/><g fill="white"><text x="55" y="140" font-size="32">$35 + ($6 × 5) = $65 per month</text><text x="55" y="205" font-size="40" font-weight="700">$65 × 12 = $780 annual subscription</text></g><text x="45" y="305" font-size="28">Provider extras → confirm separately</text><text x="45" y="360" font-size="28">Wages + employer taxes + benefits → separate scope</text><text x="45" y="415" font-size="28">Your administration time → internal cost</text><text x="45" y="480" font-size="23">Unknown is pending, not zero · checked October 28, 2026</text></g></svg>