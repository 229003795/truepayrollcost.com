<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">A first-year tie can change at renewal</title><desc id="d">Hypothetical billing assumptions, not Paychex prices. First year948, next year984. Run waiver96 expires; setup60 ends; net36.</desc><rect width="960" height="440" rx="16" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#18324d"><text x="36" y="46" font-size="23" font-weight="700">Same rates. Different fee applicability.</text><text x="36" y="78" font-size="18">HYPOTHETICAL EXAMPLE · NOT A PAYCHEX QUOTE</text><rect x="36" y="105" width="428" height="200" rx="10" fill="white"/><rect x="484" y="105" width="440" height="200" rx="10" fill="white"/><text x="58" y="144" font-size="22">First service year</text><text x="58" y="182" font-size="20">240 + 528 + 60 + 120</text><text x="58" y="252" font-size="46" font-weight="700">$948</text><text x="506" y="144" font-size="22">Following service year</text><text x="506" y="182" font-size="20">240 + 624 + 120</text><text x="506" y="252" font-size="46" font-weight="700">$984</text><text x="36" y="355" font-size="24">+ $96 waiver ends − $60 setup ends = + $36</text><text x="36" y="399" font-size="18">Unchanged scope and rates; no renewal waiver assumed.</text></g></svg>